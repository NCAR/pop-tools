name: Cancel
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - requested
jobs:
  cancel:
    name: Cancel previous runs
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@3155a141048f8f89c06b4cdae32e7853e97536bc #0.13.0
        with:
          workflow_id: ${{ github.event.workflow.id }}
